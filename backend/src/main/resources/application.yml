spring:
  application:
    name: netscope

  datasource:
    url: jdbc:postgresql://localhost:5432/netscope
    username: netscope
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html